 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physionic</title>

    <link rel="stylesheet" href="./output.css">
</head>

<body>
    <header>
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between
                    lg:py-6">

            <h2 class="text-xl font-bold ">
                Physionic
            </h2>

            <nav class="hidden lg:flex gap-8 text-sm ">
                <p>Home</p>
                <a href="#">Product</a>
                <a href="#">Pricing</a>
                <a href="#">Contact</a>
            </nav>

            <button class="lg:hidden text-2xl ">
                ☰
            </button>

            <button class="hidden lg:block bg-[#23A6E1] px-5 py-3
                           text-xs font-bold text-white">
                Get Quote Now →
            </button>
            

        </div>
    </header>
    <section class="large:[url('../background%20(1).png')] bg-cover bg-center">

        <div class="max-w-6xl mx-auto px-6 py-12 grid gap-10
                    lg:grid-cols-2 lg:items-center lg:py-20">
                    

            <div class="text-center lg:text-left">

                <h1 class="text-4xl font-bold leading-tight 
                           lg:text-5xl">
                    Meet the Best
                    <br>
                    Hospital
                </h1>

                <p class="max-w-md mx-auto mt-5 text-sm 
                          lg:mx-0">
                    We know how large objects will act,
                    but things on a small scale.
                </p>

                <div class="mt-7 flex flex-col gap-3 sm:flex-row
                            lg:justify-start">

                    <button class="rounded-full bg-[#23A6E1]
                                   px-7 py-3 text-sm font-bold ">
                        Get Quote Now
                    </button>
                     <button class="rounded-full border border-white
                                   px-7 py-3 text-sm ">
                        Learn More
                    </button>
                    

                </div>

            </div>
            <div class="bg-white rounded-lg p-6 shadow-xl
                        lg:w-[330px] lg:ml-auto">

                <h2 class="text-xl font-bold">
                    Book Appointment
                </h2>

                <div class="mt-5 space-y-4">

                    <div>
                        <label class="text-xs font-bold">
                            Name*
                        </label>

                        <input
                            type="text"
                            placeholder="Full Name"
                            class="w-full mt-2 p-3 border rounded text-xs">
                    </div>

                    <div>
                        <label class="text-xs font-bold">
                            Email address*
                        </label>

                        <input
                            type="email"
                            placeholder="example@gmail.com"
                            class="w-full mt-2 p-3 border rounded text-xs">
                    </div>
                     <div>
                        <label class="text-xs font-bold">
                            Department*
                        </label>

                        <select class="w-full mt-2 p-3 border rounded
                                       text-xs text-gray-400">
                            <option>Please Select</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs font-bold">
                            Time*
                        </label>
 <select class="w-full mt-2 p-3 border rounded
                                       text-xs text-gray-400">
                            <option>4:00 Available</option>
                        </select>
                    </div>

                    <button class="w-full py-3 rounded
                                   bg-[#23A6E1] text-xs font-bold text-white">
                        Book Appointment
                    </button>

                </div>
            </div>

        </div>

    </section>
